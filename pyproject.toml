[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datacenter-heat-reuse"
version = "0.1.0"
description = "Reproducible Python laboratory and original research archive for data-centre heat recovery"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
heat-reuse = "heat_reuse.__main__:main"

[tool.setuptools.packages.find]
include = ["heat_reuse*", "tools*"]

[tool.setuptools.package-data]
heat_reuse = ["pool_v04_forcing_17digit.json.gz"]
