name: Numerical verification and container smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  numerical:
    name: Native Python numerical regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-to-Python numerical fixtures
        run: python -m heat_reuse verify
      - name: CLI model listing
        run: python -m heat_reuse list > /tmp/heat-reuse-models.json
      - name: Inspect model listing JSON
        run: python -m json.tool /tmp/heat-reuse-models.json > /dev/null

  container:
    name: Docker build and HTTP smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build runnable application
        run: docker compose build
      - name: Start isolated web application
        run: docker compose up -d --no-build
      - name: Verify server health from inside container
        run: |
          set -eu
          for i in $(seq 1 30); do
            if docker compose exec -T laboratory python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health',timeout=3)" ; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=100
          exit 1
      - name: Report container diagnostics on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail=150 || true
      - name: Tear down without deleting persistent volumes
        if: always()
        run: docker compose down
