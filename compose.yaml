name: datacenter-heat-reuse
services:
  laboratory:
    build: .
    image: datacenter-heat-reuse:local
    ports:
      - "127.0.0.1:${HEAT_REUSE_PORT:-8080}:8080"
    volumes:
      - experiments:/data
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m
    restart: "no"
volumes:
  experiments:
